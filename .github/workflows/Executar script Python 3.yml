name: Executar script Python 3

on:
  schedule:
    - cron: "20,50 * * * 1-5"
    - cron: "0 20 * * 6,0"     
  workflow_dispatch:            # Execução manual 

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  
jobs: 
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Clonar o repositório
        uses: actions/checkout@v6

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.11

      - name: 📦 Instalar dependências
        run: |
          pip install pandas requests google-auth google-auth-httplib2 google-auth-oauthlib google-api-python-client python-dateutil

      - name: 🔐 Criar credenciais do Google
        run: |
          echo '${{ secrets.GOOGLE_CREDS }}' > credenciais.json

      - name: ▶️ Executar o script
        env:
          USUARIO_WS: ${{ secrets.USUARIO_WS }}
          SENHA_WS: ${{ secrets.SENHA_WS }}
        run: python main.py
